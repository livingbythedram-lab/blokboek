<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Blokboek</title>
<meta name="description" content="Study with short lessons, practice exercises, quizzes and flashcards, also offline.">
<meta name="theme-color" content="#FFF3F9" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1A1128" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Blokboek">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="format-detection" content="telephone=no">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style id="bb-style">
:root{
  --paper:#FFF3F9; --dot:#F7D3E6; --sheet:#FFFFFF;
  --ink:#2B1B3D; --ink-2:#5C4870; --ink-3:#8C7AA0;
  --line:#2B1B3D; --rule:#EEDCEB; --rule-soft:#FBEFF6;
  --pink:#FF6FAE; --pink-soft:#FFDAEB;
  --yellow:#FFD23F; --yellow-soft:#FFF0B3;
  --blue:#4CC3FF; --blue-soft:#D8F2FF;
  --purple:#9B6BFF; --purple-soft:#EBE1FF;
  --good:#0B8A5F; --good-fill:#3DDC97; --good-bg:#D3F7E8;
  --bad:#D92D4B; --bad-fill:#FF6B7F; --bad-bg:#FFE1E6;
  --marker:var(--yellow-soft); --marker-solid:var(--yellow); --card-margin:var(--pink);
  --focus:#3B82F6; --btn-ink:#2B1B3D;
  --bw:3px; --shadow:4px 4px 0 var(--line); --shadow-sm:3px 3px 0 var(--line);
  --font-ui:"Nunito","Segoe UI Rounded","Segoe UI",system-ui,-apple-system,sans-serif;
  --font-display:"Lilita One","Arial Rounded MT Bold","Segoe UI",system-ui,sans-serif;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --paper:#1A1128; --dot:#2D2042; --sheet:#2A1E3E; --ink:#FFF1F8; --ink-2:#DCCAEA; --ink-3:#A893BD;
    --line:#09040F; --rule:#3E2F55; --rule-soft:#33254A;
    --pink-soft:#5B2A49; --yellow-soft:#5A4813; --blue-soft:#173F56; --purple-soft:#3B2B66;
    --good:#5BE3A8; --good-bg:#123D2E; --bad:#FF8597; --bad-bg:#4A1A26; --focus:#8AB4FF;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#1A1128; --dot:#2D2042; --sheet:#2A1E3E; --ink:#FFF1F8; --ink-2:#DCCAEA; --ink-3:#A893BD;
  --line:#09040F; --rule:#3E2F55; --rule-soft:#33254A;
  --pink-soft:#5B2A49; --yellow-soft:#5A4813; --blue-soft:#173F56; --purple-soft:#3B2B66;
  --good:#5BE3A8; --good-bg:#123D2E; --bad:#FF8597; --bad-bg:#4A1A26; --focus:#8AB4FF;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
body{margin:0;background-color:var(--paper);background-image:radial-gradient(circle,var(--dot) 1.4px,transparent 1.7px);background-size:22px 22px;color:var(--ink);font-family:var(--font-ui);font-size:16px;line-height:1.5}
[hidden]{display:none!important}
:focus-visible{outline:3px solid var(--focus);outline-offset:3px}
h1,h2,h3,h4{line-height:1.15;margin:0;font-family:var(--font-display);font-weight:400;letter-spacing:.01em}
p{margin:0}
.muted{color:var(--ink-2)}
.small{font-size:.875rem}
.center{text-align:center}
.hl{background:linear-gradient(transparent 55%,var(--yellow) 55%,var(--yellow) 92%,transparent 92%);-webkit-box-decoration-break:clone;box-decoration-break:clone;padding:0 .12em;margin:0 -.12em}
[data-theme="dark"] .hl,:root:not([data-theme="light"]) .hl{color:inherit}

/* layout */
.app{display:grid;grid-template-columns:250px minmax(0,1fr);max-width:1260px;margin:0 auto}
.side{position:sticky;top:env(safe-area-inset-top,0px);align-self:start;padding:26px 16px 28px 22px;display:flex;flex-direction:column;gap:18px;max-height:100dvh;overflow:auto}
.brand{align-self:flex-start;font-family:var(--font-display);font-size:1.75rem;line-height:1.1;background:var(--yellow);color:#2B1B3D;border:var(--bw) solid var(--line);border-radius:14px;padding:4px 14px 6px;box-shadow:var(--shadow-sm);transform:rotate(-3deg);margin:4px 0 0 2px}
.side-buddy{display:flex;align-items:center;gap:8px}
.side-buddy .chip{font-weight:800;font-size:.85rem}
.side-label{font-size:.85rem;color:var(--ink-2);font-weight:800;margin-bottom:8px}
.courses{display:flex;flex-direction:column;gap:8px}
.course-link{display:block;width:100%;text-align:left;background:var(--sheet);border:2.5px solid var(--line);border-radius:14px;padding:8px 12px;font:inherit;color:var(--ink);cursor:pointer;box-shadow:2px 2px 0 var(--line)}
.course-link:hover{transform:translate(-1px,-1px);box-shadow:3px 3px 0 var(--line)}
.course-link .nm{font-weight:800;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.course-link .sub{display:block;font-size:.8rem;color:var(--ink-2);font-weight:600}
.course-link[aria-current="true"]{background:var(--pink-soft)}
.store-note{font-size:.8rem;color:var(--ink-2);line-height:1.4}
.main{padding:26px 28px 72px;min-width:0}

/* buttons & chips */
.btn{font:inherit;font-weight:800;border-radius:14px;padding:10px 18px;border:var(--bw) solid var(--line);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;line-height:1.2;text-align:center;color:var(--ink);background:var(--sheet);box-shadow:var(--shadow-sm);transition:transform .07s,box-shadow .07s}
.btn:hover:not(:disabled){transform:translate(-1px,-1px);box-shadow:4px 4px 0 var(--line)}
.btn:active:not(:disabled){transform:translate(3px,3px);box-shadow:0 0 0 var(--line)}
.btn.primary{background:var(--pink);color:#2B1B3D}
.btn.danger{color:var(--bad);margin-right:auto}
.btn.small{padding:6px 12px;font-size:.88rem;border-width:2.5px;border-radius:12px;box-shadow:2px 2px 0 var(--line)}
.btn.small:hover:not(:disabled){box-shadow:3px 3px 0 var(--line)}
.btn:disabled{opacity:.5;cursor:not-allowed;box-shadow:none}
.link{background:none;border:0;padding:0;font:inherit;font-weight:800;color:var(--ink);text-decoration:underline;text-decoration-color:var(--pink);text-decoration-thickness:3px;text-underline-offset:4px;cursor:pointer;text-align:left}
.link:hover{text-decoration-color:var(--ink)}
.chip{display:inline-block;background:var(--sheet);border:2.5px solid var(--line);border-radius:999px;padding:2px 12px;font-weight:700;box-shadow:2px 2px 0 var(--line)}
kbd{font-family:var(--font-ui);font-size:.72rem;border:2px solid currentColor;border-radius:6px;padding:0 5px;opacity:.7;margin-left:6px;font-weight:800}
.row{display:flex;flex-wrap:wrap;gap:12px;align-items:center}

.banner{background:var(--yellow-soft);border:var(--bw) solid var(--line);border-radius:16px;padding:12px 16px;margin-bottom:20px;font-weight:600;box-shadow:var(--shadow-sm)}

/* mascot & bubble */
.mascot{flex:none;display:block;overflow:visible}
.mascot.cheer{animation:hop .7s ease-out}
.mascot.sad{animation:tilt .7s ease-in-out}
@keyframes hop{0%,100%{transform:none}30%{transform:translateY(-12px)}55%{transform:none}75%{transform:translateY(-5px)}}
@keyframes tilt{0%,100%{transform:none}30%{transform:rotate(-6deg)}65%{transform:rotate(4deg)}}
.buddy{display:flex;align-items:center;gap:12px}
.bubble{position:relative;background:var(--sheet);border:2.5px solid var(--line);border-radius:18px;padding:10px 15px;font-weight:700;box-shadow:var(--shadow-sm);max-width:38ch;line-height:1.4}
.bubble::before{content:"";position:absolute;left:-9px;top:50%;width:14px;height:14px;margin-top:-7px;background:var(--sheet);border-left:2.5px solid var(--line);border-bottom:2.5px solid var(--line);transform:rotate(45deg)}

/* course header & tabs */
.course-head{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;margin-bottom:18px}
.course-head h1{font-size:clamp(2rem,4.2vw,2.8rem)}
.exam-line{display:inline-block;margin-top:10px;background:var(--blue-soft);border:2.5px solid var(--line);border-radius:14px;padding:2px 14px;font-weight:700;font-size:.92rem}
.tabs{display:flex;gap:10px;overflow-x:auto;padding:4px 6px 12px 2px;margin-bottom:16px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{border:2.5px solid var(--line);background:var(--sheet);padding:8px 16px;font:inherit;font-weight:800;color:var(--ink);cursor:pointer;white-space:nowrap;display:flex;gap:6px;align-items:center;border-radius:999px;box-shadow:2px 2px 0 var(--line);flex:none}
.tab:hover{transform:translate(-1px,-1px);box-shadow:3px 3px 0 var(--line)}
.tab[aria-current="page"]{background:var(--yellow);color:#2B1B3D}
.badge{font-size:.72rem;background:var(--pink);color:#2B1B3D;border:2px solid var(--line);border-radius:999px;padding:0 7px;font-weight:900}

.panel{max-width:840px}
.panel h2{font-size:1.75rem;margin-bottom:10px}
.panel h3{font-size:1.25rem}

.busy{display:flex;gap:16px;align-items:center;padding:16px 18px;border:var(--bw) solid var(--line);border-radius:18px;margin-bottom:20px;background:var(--sheet);box-shadow:var(--shadow)}
.busy div{flex:1}
.busy p{color:var(--ink-2);font-size:.92rem}
.pulse{display:flex;gap:6px}
.pulse i{width:12px;height:12px;border-radius:50%;border:2px solid var(--line);background:var(--pink);animation:pulse 1.2s infinite ease-in-out}
.pulse i:nth-child(2){background:var(--yellow);animation-delay:.15s}.pulse i:nth-child(3){background:var(--blue);animation-delay:.3s}
@keyframes pulse{0%,80%,100%{transform:scale(.65)}40%{transform:scale(1.05)}}

.empty{padding:26px 0;max-width:600px;display:flex;gap:20px;align-items:flex-start}
.empty h2{margin-bottom:8px}
.empty p{color:var(--ink-2);margin-bottom:18px}

/* sticker sheets (cards) */
.index-card{background:var(--sheet);border:var(--bw) solid var(--line);border-radius:20px;box-shadow:var(--shadow);overflow:hidden}
.card-head{padding:14px 20px;background:var(--blue-soft);border-bottom:var(--bw) solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.card-body{padding:18px 20px 20px;line-height:1.6}
.card-body ol,.card-body ul{margin:0;padding-left:1.3em}
.card-body li{margin:4px 0}
.card-body > * + *{margin-top:10px}

.welcome{max-width:660px;padding-top:14px}
.welcome .buddy{margin-bottom:22px}
.welcome .card-head{background:var(--pink-soft)}
.welcome .card-head h1{font-size:clamp(1.9rem,4.6vw,2.7rem);padding:6px 0}
.welcome .card-body{font-size:1.06rem}
.welcome .card-body .row{padding-top:8px}
.welcome-foot{margin-top:18px;color:var(--ink-2);font-size:.9rem;font-weight:600}

/* plan */
.overview{font-size:1.06rem;line-height:1.7;color:var(--ink-2);max-width:66ch;margin-bottom:22px;font-weight:600}
.today{margin-bottom:30px}
.today .card-head{background:var(--yellow-soft)}
.today .card-head h2{font-size:1.4rem;margin:0}
.today select,.goal-card select{width:auto;padding:4px 8px;margin-left:6px;border-width:2px}
.unit{margin-top:32px}
.unit-head{display:flex;justify-content:space-between;gap:12px;align-items:center;margin-bottom:12px;flex-wrap:wrap}
.unit-head h3{font-size:1.35rem}
.unit-head .num{display:inline-block;font-family:var(--font-ui);font-weight:800;font-size:.8rem;background:var(--purple-soft);border:2px solid var(--line);border-radius:999px;padding:1px 10px;margin:0 0 6px;letter-spacing:0}
.unit-head h3 .num{display:table}
.lessons{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.lrow{display:grid;grid-template-columns:30px minmax(0,1fr) auto;gap:12px;align-items:center;width:100%;text-align:left;background:var(--sheet);border:2.5px solid var(--line);border-radius:16px;padding:12px 14px;font:inherit;color:inherit;cursor:pointer;box-shadow:var(--shadow-sm);transition:transform .07s,box-shadow .07s}
.lrow:hover{transform:translate(-1px,-1px);box-shadow:4px 4px 0 var(--line)}
.dot{width:28px;height:28px;border-radius:50%;border:2.5px solid var(--line);display:grid;place-items:center;font-size:14px;font-weight:900;line-height:1;background:var(--sheet)}
.dot.done{background:var(--good-fill);color:#2B1B3D}
.lrow .t{font-weight:800;display:block}
.lrow .g{color:var(--ink-2);font-size:.9rem;display:block}
.lrow .d{color:var(--ink-2);font-size:.82rem;font-weight:700;white-space:nowrap}
.lrow .d.now{background:var(--yellow);color:#2B1B3D;border:2px solid var(--line);border-radius:999px;padding:1px 9px}
.plan-foot{margin-top:28px}

/* lesson */
.lesson .back{margin-bottom:22px}
.kicker{display:inline-block;color:var(--ink);font-weight:800;font-size:.85rem;margin-bottom:10px;background:var(--purple-soft);border:2px solid var(--line);border-radius:999px;padding:1px 12px}
.lesson-title{font-size:clamp(1.8rem,3.6vw,2.5rem);margin-bottom:12px}
.goal{color:var(--ink-2);margin-bottom:24px;max-width:66ch;font-weight:700}
.reading{font-size:1.08rem;line-height:1.75;max-width:68ch;background:var(--sheet);border:var(--bw) solid var(--line);border-radius:20px;padding:22px 26px;box-shadow:var(--shadow)}
.reading p{margin:0 0 1em}
.reading h3{font-size:1.35rem;margin:1.4em 0 .5em}
.reading h3:first-child{margin-top:0}
.reading h4{font-size:1.15rem;margin:1.2em 0 .4em}
.reading ul,.reading ol{padding-left:1.3em;margin:0 0 1em}
.reading li{margin:.3em 0}
.reading blockquote{margin:0 0 1em;padding:8px 14px;border-left:5px solid var(--pink);background:var(--pink-soft);border-radius:0 12px 12px 0}
.reading code{font-size:.9em;background:var(--rule-soft);padding:1px 5px;border-radius:6px}
.reading strong{font-weight:800;background:linear-gradient(transparent 60%,var(--yellow-soft) 60%)}
.reading:empty{display:none}
.src{font-family:var(--font-ui);font-size:.72rem;font-weight:800;border:2px solid var(--line);background:var(--blue-soft);color:var(--ink);border-radius:999px;padding:0 8px;margin:0 2px;cursor:pointer;vertical-align:2px;line-height:1.6;white-space:nowrap}
.src:hover{background:var(--yellow)}
.lesson-actions{display:flex;flex-wrap:wrap;gap:12px;align-items:center;margin-top:28px}
.done-tag{font-weight:800;background:var(--good-fill);color:#2B1B3D;border:2.5px solid var(--line);border-radius:999px;padding:4px 14px}
.empty-inline{border:3px dashed var(--ink-3);border-radius:20px;padding:22px;display:flex;flex-direction:column;gap:12px;align-items:flex-start;background:var(--sheet)}

/* forms */
label.f{display:block;font-weight:800;margin:14px 0 6px}
input,select,textarea{font:inherit;width:100%;padding:10px 12px;border:2.5px solid var(--line);border-radius:12px;background:var(--sheet);color:var(--ink)}
textarea{resize:vertical;min-height:140px}
.opt-t{font-weight:600;color:var(--ink-2)}
.form-row{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1fr);gap:14px;margin:16px 0 18px}

/* quiz */
.quiz-top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:12px;font-weight:800}
.bar{height:18px;background:var(--sheet);border:2.5px solid var(--line);border-radius:999px;overflow:hidden}
.bar>i{display:block;height:100%;background-color:var(--pink);background-image:repeating-linear-gradient(-45deg,rgba(255,255,255,.35) 0 7px,transparent 7px 14px);border-right:2.5px solid var(--line);border-radius:999px;transition:width .35s}
.bar>i[style*="width:0%"]{border-right:0}
.question{font-size:clamp(1.4rem,2.8vw,1.8rem);margin:24px 0 18px;max-width:38ch}
.opts{display:flex;flex-direction:column;gap:12px;max-width:640px}
.opt{display:flex;gap:14px;align-items:center;text-align:left;width:100%;padding:12px 16px;border:2.5px solid var(--line);border-radius:16px;background:var(--sheet);font:inherit;font-weight:700;color:inherit;cursor:pointer;box-shadow:var(--shadow-sm);transition:transform .07s,box-shadow .07s}
.opt:hover:not(:disabled){transform:translate(-1px,-1px);box-shadow:4px 4px 0 var(--line)}
.opt:disabled{cursor:default}
.opt .k{flex:none;width:30px;height:30px;display:grid;place-items:center;font-weight:900;font-size:.9rem;border:2.5px solid var(--line);border-radius:9px;background:var(--rule-soft)}
.opt.sel{background:var(--yellow-soft)}
.opt.sel .k{background:var(--yellow);color:#2B1B3D}
.opt.correct{background:var(--good-bg)}
.opt.correct .k{background:var(--good-fill);color:#2B1B3D}
.opt.wrong{background:var(--bad-bg)}
.opt.wrong .k{background:var(--bad-fill);color:#2B1B3D}
.feedback{margin:18px 0;padding:14px 16px;border-radius:16px;max-width:640px;line-height:1.6;border:2.5px solid var(--line);box-shadow:var(--shadow-sm)}
.feedback.good{background:var(--good-bg)}
.feedback.bad{background:var(--bad-bg)}
.quiz .actions{display:flex;gap:12px;flex-wrap:wrap;margin-top:20px}
.quiz-result .buddy{margin-bottom:18px}
.review-list{padding-left:1.2em;max-width:680px}
.review-list li{margin-bottom:18px}
.review-list .rq{font-weight:800;margin-bottom:4px}
.good-t{color:var(--good);font-weight:900}.bad-t{color:var(--bad);font-weight:900}
.hist{width:100%;border-collapse:separate;border-spacing:0;font-size:.92rem;margin-top:12px;background:var(--sheet);border:2.5px solid var(--line);border-radius:14px;overflow:hidden}
.hist th,.hist td{text-align:left;padding:9px 12px;border-bottom:2px solid var(--rule)}
.hist tr:last-child td{border-bottom:0}
.hist th{background:var(--purple-soft);font-weight:800;border-bottom:2.5px solid var(--line)}
.hist td:last-child,.hist th:last-child{text-align:right}

/* flashcards */
.review{max-width:620px}
.fc{display:block;width:100%;padding:0;border:0;background:none;font:inherit;color:inherit;cursor:pointer;perspective:1400px;margin:16px 0 18px;text-align:center}
.fc-inner{display:grid;transition:transform .5s cubic-bezier(.3,.7,.3,1);transform-style:preserve-3d}
.fc.flipped .fc-inner{transform:rotateY(180deg)}
.fc-face{grid-area:1/1;position:relative;-webkit-backface-visibility:hidden;backface-visibility:hidden;min-height:260px;border:var(--bw) solid var(--line);border-radius:22px;box-shadow:var(--shadow);padding:52px 28px 32px;display:grid;place-items:center;background:var(--pink-soft)}
.fc-front .fc-text{font-family:var(--font-display);font-size:1.6rem;line-height:1.25}
.fc-back{transform:rotateY(180deg);background:var(--blue-soft)}
.fc-back .fc-text{font-size:1.15rem;font-weight:700;line-height:1.55}
.fc-side{position:absolute;top:14px;left:16px;font-size:.78rem;font-weight:800;background:var(--sheet);border:2px solid var(--line);border-radius:999px;padding:0 10px;line-height:1.6}
.rate{display:flex;flex-direction:column;gap:12px;align-items:center}
.gen{margin-top:30px;padding:20px;background:var(--sheet);border:var(--bw) solid var(--line);border-radius:20px;box-shadow:var(--shadow)}
.gen .row{margin-top:14px}
.gen select{max-width:420px}
.all-cards{margin-top:26px;background:var(--sheet);border:2.5px solid var(--line);border-radius:16px;padding:12px 16px}
.all-cards summary{cursor:pointer;font-weight:800}
.all-cards ul{list-style:none;padding:0;margin:12px 0 0}
.all-cards li{display:flex;justify-content:space-between;gap:14px;align-items:flex-start;padding:12px 0;border-top:2px dashed var(--rule)}
.all-cards li p{color:var(--ink-2);font-size:.92rem}
.review-done .buddy{margin-bottom:18px}

/* progress & album */
.summary{font-size:1.15rem;line-height:1.7;max-width:62ch;font-weight:600}
.summary p{margin-bottom:.4em}
.summary strong{font-weight:900}
.pgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:22px;margin-top:26px;align-items:start}
.pgrid section{background:var(--sheet);border:var(--bw) solid var(--line);border-radius:20px;padding:18px 20px;box-shadow:var(--shadow)}
.pgrid .stack-col{display:flex;flex-direction:column;gap:22px}
.unit-progress{list-style:none;padding:0;margin:14px 0 0;display:flex;flex-direction:column;gap:14px}
.up-head{display:flex;justify-content:space-between;gap:10px;font-size:.92rem;font-weight:700;margin-bottom:6px}
.qchart{display:flex;align-items:flex-end;gap:6px;height:140px;margin-top:14px;border-bottom:2.5px solid var(--line)}
.qbar{flex:1;max-width:38px;height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:4px}
.qbar i{display:block;width:100%;background:var(--yellow);border:2.5px solid var(--line);border-bottom:0;border-radius:8px 8px 0 0;min-height:4px}
.qbar span{font-size:.7rem;color:var(--ink-2);font-weight:800}
.stack{display:flex;height:18px;border-radius:999px;overflow:hidden;background:var(--rule-soft);border:2.5px solid var(--line);margin:14px 0 10px}
.stack i{display:block;height:100%}
.legend{display:flex;flex-wrap:wrap;gap:14px;font-size:.85rem;color:var(--ink-2);font-weight:700}
.legend span::before{content:"";display:inline-block;width:12px;height:12px;border-radius:4px;border:2px solid var(--line);margin-right:6px;background:var(--c);vertical-align:-2px}
.album-sec{margin-top:26px}
.album{display:grid;grid-template-columns:repeat(auto-fill,minmax(128px,1fr));gap:18px 12px;margin-top:12px;padding:20px 16px;background-color:var(--sheet);background-image:radial-gradient(circle,var(--rule) 1.3px,transparent 1.6px);background-size:18px 18px;border:var(--bw) solid var(--line);border-radius:22px;box-shadow:var(--shadow)}
.stk{margin:0;display:flex;flex-direction:column;align-items:center;text-align:center;gap:6px}
.sticker{display:block;transform:rotate(var(--r,0deg));filter:drop-shadow(2px 3px 0 rgba(43,27,61,.3))}
.sticker-empty{width:86px;height:86px;border:3px dashed var(--ink-3);border-radius:50%;display:grid;place-items:center;font-family:var(--font-display);font-size:1.9rem;color:var(--ink-3);margin:12px 0}
.stk figcaption strong{display:block;font-weight:900;font-size:.9rem}
.stk figcaption span{display:block;font-size:.78rem;color:var(--ink-2);line-height:1.35}
.stk:not(.got) figcaption strong{color:var(--ink-2)}

/* material */
.drop{border:3px dashed var(--ink-3);border-radius:22px;padding:30px 20px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:10px;margin:18px 0;background:var(--sheet)}
.drop.over{border-style:solid;border-color:var(--line);background:var(--yellow-soft)}
.drop strong{font-family:var(--font-display);font-weight:400;font-size:1.3rem}
.imports{list-style:none;padding:0;margin:0 0 10px}
.imports li{display:flex;justify-content:space-between;gap:12px;align-items:center;padding:10px 14px;border-radius:14px;background:var(--sheet);border:2.5px solid var(--line);margin-bottom:10px;font-size:.92rem;box-shadow:2px 2px 0 var(--line)}
.imports li.err{background:var(--bad-bg)}
.paste{margin:10px 0 24px;border:2.5px solid var(--line);border-radius:16px;padding:12px 16px;background:var(--sheet);box-shadow:2px 2px 0 var(--line)}
.paste summary{cursor:pointer;font-weight:800}
.paste .btn{margin-top:14px}
.files{list-style:none;padding:0;margin:12px 0 0;display:flex;flex-direction:column;gap:10px}
.files li{display:flex;justify-content:space-between;gap:14px;align-items:center;padding:10px 14px;background:var(--sheet);border:2.5px solid var(--line);border-radius:14px;box-shadow:2px 2px 0 var(--line)}
.files li div{min-width:0}
.files strong{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:800}
.files .muted{font-size:.88rem}
.cta-box{margin:26px 0 18px;padding:18px 20px;border-radius:20px;background:var(--purple-soft);border:var(--bw) solid var(--line);box-shadow:var(--shadow);display:flex;flex-direction:column;gap:12px;align-items:flex-start;font-weight:700}

/* dialogs */
dialog{border:var(--bw) solid var(--line);border-radius:22px;padding:0;background:var(--sheet);color:var(--ink);width:min(560px,calc(100vw - 32px));max-height:calc(100dvh - 48px);box-shadow:6px 6px 0 var(--line)}
dialog::backdrop{background:rgba(43,27,61,.55)}
.dlg{padding:24px}
.dlg h2{font-size:1.6rem;margin-bottom:6px}
.dlg p{margin-top:8px}
.dlg-actions{display:flex;gap:12px;justify-content:flex-end;margin-top:22px;flex-wrap:wrap}
.dlg-h{font-size:1.2rem;margin:20px 0 6px}
.dlg .row{margin-top:10px}
.dlg .muted.small{margin-top:8px}
.src-text{white-space:pre-wrap;max-height:50vh;overflow:auto;background:var(--rule-soft);border:2px solid var(--rule);padding:14px 16px;border-radius:14px;font-size:.95rem;line-height:1.6;margin-top:12px}
.celebrate{overflow:hidden;text-align:center}
.cel-body{position:relative;padding:26px 24px 24px;display:flex;flex-direction:column;align-items:center;gap:12px}
.cel-body h2{font-size:2rem}
.cel-stickers{display:flex;gap:18px 22px;flex-wrap:wrap;justify-content:center;margin:6px 0}
.cel-stickers .stk{width:130px}
.cel-stickers .sticker{animation:peel .8s cubic-bezier(.2,1.5,.4,1) both}
.cel-stickers .stk:nth-child(2) .sticker{animation-delay:.15s}.cel-stickers .stk:nth-child(3) .sticker{animation-delay:.3s}.cel-stickers .stk:nth-child(4) .sticker{animation-delay:.45s}
@keyframes peel{from{transform:scale(.2) rotate(-50deg);opacity:0}to{transform:scale(1) rotate(var(--r,0deg));opacity:1}}
.cel-body .dlg-actions{justify-content:center;margin-top:8px}
.confetti{position:absolute;inset:0;pointer-events:none;overflow:hidden;z-index:0}
.confetti i{position:absolute;top:-16px;width:10px;height:15px;border:2px solid var(--line);border-radius:3px;animation:fall 1.8s ease-in forwards}
.cel-body{z-index:1}
@keyframes fall{to{transform:translateY(560px) rotate(560deg);opacity:0}}

.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);background:var(--sheet);color:var(--ink);border:var(--bw) solid var(--line);padding:12px 18px;border-radius:16px;max-width:min(520px,calc(100vw - 32px));opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;font-size:.95rem;font-weight:700;z-index:50;box-shadow:var(--shadow)}
.toast.show{opacity:1;transform:translate(-50%,0)}
.toast.err{background:var(--bad-bg)}
.loading{color:var(--ink-2);padding:40px 0;font-weight:700}

/* practice */
.prac-intro{margin-bottom:20px;max-width:62ch;font-weight:600}
.goal-card{margin-bottom:8px}
.inbox-card{margin-bottom:24px;max-width:840px}
.inbox-card .card-head{background:var(--pink-soft)}
.inbox-card .card-head h2{font-size:1.35rem;margin:0}
.goal-card .card-head{background:var(--purple-soft)}
.goal-card .card-head h2{font-size:1.4rem;margin:0}
.goal-bar{height:20px}
.prow{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 14px;background:var(--sheet);border:2.5px solid var(--line);border-radius:16px;box-shadow:var(--shadow-sm)}
.prow .pt{display:flex;flex-direction:column;gap:6px;min-width:0}
.prow .t{font-weight:800}
.lvl{display:inline-flex;gap:5px}
.lvl i{width:22px;height:10px;border-radius:999px;border:2px solid var(--line);background:var(--rule-soft)}
.lvl i.on{background:var(--yellow)}
.prac{max-width:720px;margin:0 auto;min-height:calc(100vh - 26px);min-height:calc(100dvh - 26px);display:flex;flex-direction:column}
.main:has(.prac){padding-bottom:0}
.prac-top{display:flex;align-items:center;gap:14px;margin-bottom:28px}
.prac-top .bar{flex:1;height:22px}
.combo{font-weight:900;font-size:.9rem;min-width:5.5em;text-align:right;white-space:nowrap}
.combo:not(:empty){background:var(--yellow);color:#2B1B3D;border:2.5px solid var(--line);border-radius:999px;padding:2px 10px;min-width:0}
.prac-body{flex:1}
.prac-wait{display:flex;flex-direction:column;align-items:center;text-align:center;gap:12px;padding-top:30px}
.prac-wait h2{font-size:1.6rem}
.prac-wait p{max-width:50ch;font-weight:600}
.prac-kicker{display:flex;align-items:center;gap:8px;margin-bottom:12px;font-weight:800;font-size:.88rem}
.prac-kicker span:first-child{background:var(--purple-soft);border:2px solid var(--line);border-radius:999px;padding:1px 12px}
.retry-tag{background:var(--yellow);color:#2B1B3D;border:2px solid var(--line);border-radius:999px;padding:1px 10px}
.prac-q{font-size:clamp(1.45rem,3.2vw,2rem);margin-bottom:24px;max-width:36ch;line-height:1.2}
.tf{display:grid;grid-template-columns:1fr 1fr;gap:14px;max-width:540px}
.tf .opt{justify-content:center;font-size:1.15rem;padding:20px}
.tiles{display:flex;flex-wrap:wrap;gap:12px}
.tiles.steps{flex-direction:column;align-items:stretch}
.tile{font:inherit;font-weight:800;padding:10px 16px;min-height:48px;border:2.5px solid var(--line);border-radius:14px;background:var(--sheet);color:var(--ink);cursor:pointer;box-shadow:var(--shadow-sm);text-align:left;line-height:1.3;transition:transform .07s,box-shadow .07s,background .12s}
.tile:hover:not(:disabled){transform:translate(-1px,-1px);box-shadow:4px 4px 0 var(--line)}
.tile:active:not(:disabled){transform:translate(3px,3px);box-shadow:0 0 0 var(--line)}
.tile:disabled{cursor:default}
.tile.sel{background:var(--yellow);color:#2B1B3D}
.tile.ph{color:transparent;background:transparent;border:2.5px dashed var(--ink-3);box-shadow:none}
.tile.ok{background:var(--good-bg)}
.tile.bad{background:var(--bad-bg)}
.tile.done{opacity:.45;box-shadow:none}
.line-area{min-height:72px;display:flex;flex-wrap:wrap;gap:12px;align-items:center;padding:12px;margin-bottom:24px;border:3px dashed var(--ink-3);border-radius:18px;background:var(--sheet)}
.line-area.steps{flex-direction:column;align-items:stretch}
.line-hint{color:var(--ink-2);font-size:.92rem;font-weight:700}
.gap-sent{font-size:clamp(1.2rem,2.6vw,1.45rem);font-weight:700;line-height:2.4;margin-bottom:26px;max-width:40ch;background:var(--sheet);border:var(--bw) solid var(--line);border-radius:20px;padding:14px 20px;box-shadow:var(--shadow)}
.slot{display:inline-block;min-width:5.5em;text-align:center;border:2.5px dashed var(--ink-3);background:var(--rule-soft);font:inherit;font-weight:900;padding:0 12px;margin:0 4px;color:var(--ink);cursor:pointer;line-height:1.6;border-radius:10px}
.slot.filled{background:var(--yellow);color:#2B1B3D;border-style:solid;border-color:var(--line)}
.slot.ok{background:var(--good-fill);color:#2B1B3D;border-style:solid;border-color:var(--line)}
.slot.bad{background:var(--bad-fill);color:#2B1B3D;border-style:solid;border-color:var(--line)}
.slot:disabled{cursor:default}
.match{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.mcol{display:flex;flex-direction:column;gap:12px}
.mcol .tile{width:100%}
.shake{animation:shake .4s}
@keyframes shake{0%,100%{transform:none}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.tray{min-height:52px;margin-bottom:20px}
.bins{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px;margin-bottom:14px}
.bin{border:var(--bw) solid var(--line);border-radius:18px;background:var(--sheet);overflow:hidden;box-shadow:var(--shadow)}
.bin-head{display:block;width:100%;text-align:left;font-family:var(--font-display);font-size:1.15rem;padding:10px 14px;background:var(--blue-soft);border:0;border-bottom:var(--bw) solid var(--line);color:var(--ink);cursor:pointer}
.bins .bin:nth-child(2) .bin-head{background:var(--pink-soft)}
.bins .bin:nth-child(3) .bin-head{background:var(--purple-soft)}
.bin-head:disabled{cursor:default}
.bin-head.armed{background:var(--yellow)!important;color:#2B1B3D}
.bin-items{padding:12px 14px;min-height:76px}
.type-ans{font-size:1.25rem;font-weight:700;padding:14px 16px;max-width:540px;border-width:var(--bw);border-radius:16px;box-shadow:var(--shadow-sm)}
.type-ans.ok{background:var(--good-bg)}
.type-ans.bad{background:var(--bad-bg)}
.prac-foot{position:sticky;bottom:0;margin-top:30px;padding:14px 18px calc(14px + env(safe-area-inset-bottom,0px));background:var(--sheet);border:var(--bw) solid var(--line);border-bottom:0;border-radius:22px 22px 0 0;display:flex;justify-content:flex-end;align-items:center;gap:12px;z-index:5;box-shadow:0 -3px 0 rgba(43,27,61,.08)}
.prac-foot.fb{justify-content:space-between;animation:rise .22s ease-out}
.prac-foot.good{background:var(--good-bg)}
.prac-foot.bad{background:var(--bad-bg)}
.prac-foot.good strong{color:var(--good)}
.prac-foot.bad strong{color:var(--bad)}
.prac-foot .hint{margin-right:auto;font-weight:700}
.fb-main{display:flex;align-items:center;gap:12px;flex:1;min-width:0}
.fb-text{flex:1;min-width:0;line-height:1.5}
.fb-text strong{font-family:var(--font-display);font-weight:400;font-size:1.45rem}
.fb-text p{margin-top:4px;font-weight:600}
@keyframes rise{from{transform:translateY(16px);opacity:.3}to{transform:none;opacity:1}}
.prac-done{max-width:640px;margin:0 auto;padding-top:6px}
.prac-done .buddy{margin-bottom:20px;justify-content:center}
.prac-done .card-head{background:var(--yellow-soft)}
.prac-done .card-head h2{font-size:1.7rem;margin:0}
.prac-done .row{padding-top:6px}

@media (max-width:760px){
  .app{grid-template-columns:1fr}
  .side{position:static;max-height:none;padding:14px 16px 4px;gap:10px;flex-direction:row;flex-wrap:wrap;align-items:center}
  .brand{font-size:1.4rem;margin-right:auto}
  .side-buddy .mascot{width:44px;height:44px}
  .side-courses{order:3;width:100%}
  .side-label,.store-note{display:none}
  .courses{flex-direction:row;overflow-x:auto;gap:8px;padding:2px 4px 6px 2px;scrollbar-width:none}
  .course-link{width:auto;flex:none;border-radius:999px;padding:6px 14px}
  .course-link .sub{display:none}
  .main{padding:12px 16px 56px}
  .course-head h1{font-size:1.8rem}
  .card-head,.card-body{padding-left:16px;padding-right:16px}
  .form-row{grid-template-columns:1fr}
  .lrow{grid-template-columns:28px minmax(0,1fr)}
  .lrow .d{grid-column:2;justify-self:start}
  .fc-face{padding:48px 18px 24px;min-height:230px}
  .reading{padding:18px}
  .empty{flex-direction:column;gap:10px}
  .buddy .mascot{width:64px;height:64px}
  .prac-top{margin-bottom:20px}
  .prac-foot{padding-left:14px;padding-right:14px}
  .prac-foot .btn{flex:1}
  .prac-foot.fb{flex-direction:column;align-items:stretch}
  .prac-foot .hint{display:none}
  .fb-main .mascot{width:48px;height:48px}
  .tile{padding:10px 12px}
  .match{gap:10px}
  .album{grid-template-columns:repeat(auto-fill,minmax(100px,1fr))}
}
.touch-tip{display:none}
@media (hover:none) and (pointer:coarse){
  .kbd-tip,kbd,.prac-foot .hint{display:none!important}
  .touch-tip{display:inline}
}
@media (prefers-reduced-motion:reduce){
  .fc-inner,.bar>i,.toast,.btn,.tile,.opt,.lrow{transition:none}
  .pulse i,.mascot.cheer,.mascot.sad,.shake,.prac-foot.fb,.cel-stickers .sticker{animation:none}
  .confetti{display:none}
}

<body>
<div id="install-tip" class="banner" hidden style="margin:12px 16px 0;display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap">
  <span>Install Blokboek first: tap <strong>Share</strong> <span aria-hidden="true">(the square with the arrow)</span>, then <strong>Add to Home Screen</strong>. Open it from your home screen before you import your subjects.</span>
  <button class="btn ghost small" type="button" id="install-tip-close">OK</button>
</div>
<div class="app">
  <aside class="side" id="side"></aside>
  <main class="main" id="main"></main>
</div>
<div id="toast" class="toast" role="status" aria-live="polite"></div>
<input type="file" id="import-input" hidden>
<script id="bb-app">
(() => {
'use strict';

const PDFJS = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js';
const PDFJS_WORKER = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
const JSZIP = 'https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js';
const INTERVALS = [0, 1, 3, 7, 14, 30];
const LANGS = {
  nl: 'Write everything in Dutch.',
  en: 'Write everything in English.',
  src: 'Write in the same language as the study material.'
};
const TABS = [['plan', 'Plan'], ['practice', 'Practise'], ['quiz', 'Quiz'], ['cards', 'Flashcards'], ['progress', 'Progress'], ['material', 'Material']];

const S = {
  ready: false, courses: [], cid: null, course: null, cards: [],
  chunks: new Map(), chunkList: [], lessonCache: {},
  tab: 'plan', lessonId: null, busy: null, stream: null,
  quiz: null, review: null, importing: [],
  sample: null, ai: false, pasteOpen: false, cardsOpen: false, prac: null, pool: [], downloads: null, inbox: []
};

/* ---------- utilities ---------- */
const $ = (sel, root = document) => root.querySelector(sel);
function esc(s) { return String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }
function rid() { return Math.random().toString(36).slice(2, 8) + Date.now().toString(36).slice(-4); }
function pad(n) { return String(n).padStart(2, '0'); }
function dstr(d) { return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`; }
function today() { return dstr(new Date()); }
function parseD(s) { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); }
function addDays(s, n) { const d = parseD(s); d.setDate(d.getDate() + n); return dstr(d); }
function diffDays(a, b) { return Math.round((parseD(b) - parseD(a)) / 86400000); }
const fmtShort = new Intl.DateTimeFormat('en-GB', { weekday: 'short', day: 'numeric', month: 'short' });
const fmtLong = new Intl.DateTimeFormat('en-GB', { weekday: 'long', day: 'numeric', month: 'long' });
function relDay(s) { const n = diffDays(today(), s); if (n === 0) return 'today'; if (n === 1) return 'tomorrow'; return fmtShort.format(parseD(s)); }
function relDayLong(s) { const n = diffDays(today(), s); if (n === 0) return 'today'; if (n === 1) return 'tomorrow'; return 'on ' + fmtLong.format(parseD(s)); }
function clone(o) { return o == null ? o : JSON.parse(JSON.stringify(o)); }
function bytes(s) { return new TextEncoder().encode(s).length; }
function shuffle(a) { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
const sleep = ms => new Promise(r => setTimeout(r, ms));
function plural(n, one, many) { return `${n} ${n === 1 ? one : many}`; }

let toastTimer;
function toast(msg, isErr) {
  const el = $('#toast');
  el.textContent = msg;
  el.className = 'toast show' + (isErr ? ' err' : '');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { el.className = 'toast'; }, isErr ? 7000 : 3500);
}

/* ---------- storage ---------- */
function openIdb() {
  return new Promise((res, rej) => {
    try {
      const r = indexedDB.open('blokboek', 1);
      r.onupgradeneeded = () => r.result.createObjectStore('kv');
      r.onsuccess = () => res(r.result);
      r.onerror = () => rej(r.error);
    } catch (e) { rej(e); }
  });
}
function idbReq(db, mode, fn) {
  return new Promise((res, rej) => {
    const tx = db.transaction('kv', mode);
    const r = fn(tx.objectStore('kv'));
    tx.oncomplete = () => res(r && r.result);
    tx.onerror = () => rej(tx.error);
    tx.onabort = () => rej(tx.error);
  });
}
async function retry(fn) {
  try { return await fn(); }
  catch (e) {
    if (e && e.code === 'unavailable') { await sleep(400 + Math.random() * 700); return fn(); }
    throw e;
  }
}
let lastSaveErr = 0;
function saveError(e) {
  if (Date.now() - lastSaveErr < 8000) return;
  lastSaveErr = Date.now();
  const code = e && e.code;
  if (code === 'invalid_argument') toast('Saving doesn\'t work: you only have read access to this page.', true);
  else if (code === 'quota_exceeded') toast('Storage is full. Delete material or a subject you no longer need.', true);
  else if (code === 'too_big') toast('This item is too large to save.', true);
  else toast('Saving failed. Your work is still on screen; try again in a moment.', true);
}

const Store = {
  mode: 'memory', col: null, idb: null, mem: new Map(), latest: new Map(), pending: new Map(), flushing: new Map(),
  async init() {
    const c = (window.claude && typeof window.claude.use === 'function') ? window.claude : null;
    let db = null, user = null, sample = null;
    if (c) {
      let downloads;
      [db, user, sample, downloads] = await Promise.all(['db', 'user', 'sample', 'downloads'].map(n => c.use(n).catch(() => null)));
      S.downloads = downloads || null;
    }
    S.sample = sample || null;
    S.ai = !!sample;
    let uid = null;
    if (db && user) { try { uid = await user.id(); } catch (e) { uid = null; } }
    if (db && uid) { this.mode = 'db'; this.db = db; this.col = db.collection('data/users/' + uid); return; }
    try { this.idb = await openIdb(); this.mode = 'local'; } catch (e) { this.mode = 'memory'; }
  },
  async get(key) {

async function extractPdf(file, onProg) {

    pdf = await lib.getDocument({ data: new Uint8Array(await file.arrayBuffer()), isEvalSupported: false, disableFontFace: true }).promise;
  } catch (e) {

    const page = await pdf.getPage(p);

      text += it.str;

}
async function extractPptx(file, onProg) {

function sectionsFromParas(paras) {
  const out = []; let cur = '';

    if (cur && cur.length + p.length > 1500) { out.push({ label: 'part', n: out.length + 1, text: cur }); cur = ''; }

  const out = []; let cur = null;
  const push = () => {
    if (cur && cur.text.trim()) out.push({ id: 'c' + (c.next++), fileId, file, loc: locStr(cur.label, cur.a, cur.b), text: cur.text.trim() });
    cur = null;

  for (const s of sections) {
    const t = cleanText(s.text);
    if (t.length < 3) continue;
    if (t.length > max * 1.35) {
      push();
      for (const piece of splitText(t, max)) out.push({ id: 'c' + (c.next++), fileId, file, loc: locStr(s.label, s.n, s.n), text: piece });
      continue;
    }

  const t = today(); const map = {}; let perDay = c.perDay || 3; let reviewFrom = null;
  if (!c.plan) return { map, perDay, reviewFrom };
  const L = allLessons(c);
  const undone = L.filter(x => !c.done[x.lesson.id]);
  const doneToday = L.filter(x => c.done[x.lesson.id] === t).length;
  if (c.exam && c.exam > t) {

  }

  const ex = s.queue[s.pos];
  if (ex.type === 'type') {
    const inp = $('#type-ans');
    if (inp) s.ui.value = inp.value;
    if (!skip && !s.ui.value.trim()) { toast('Type an answer first.'); return; }
  }
  if (!skip && !pxCanCheck(ex, s.ui)) return;
  pxResolve(skip ? { ok: false } : pxGrade(ex, s.ui), skip);
}
function pxResolve(g, skip) {
  const s = S.prac;
  const ex = s.queue[s.pos];
  s.phase = 'feedback';
  s.result = {
    ok: g.ok, note: g.note || '',
    correct: ex.type === 'match' ? '' : pxCorrectText(ex),
    head: g.ok ? PRAISE[Math.floor(Math.random() * PRAISE.length)] : (skip ? 'No problem. Here\'s how it works:' : 'Not quite.')
  };
  const addNote = t => { s.result.note = s.result.note ? s.result.note + ' ' + t : t; };
  if (!ex.retry) s.firstTotal++;
  if (g.ok) {
    s.combo++; s.maxCombo = Math.max(s.maxCombo, s.combo);
    s.xp += ex.retry ? 5 : 10;
    s.solved++;
    if (!ex.retry) { s.firstOk++; s.fixed.push(exKey(ex)); }
    if (s.combo >= 5 && s.combo % 5 === 0) addNote(`${s.combo} in a row!`);
    Sound.play('good');
  } else {
    s.combo = 0;
    if (!ex.retry) s.wrong.push(cleanEx(ex));
    const tries = ex.tries || 0;
    if (tries < 2) { s.queue.push(Object.assign(cleanEx(ex), { uid: rid(), retry: true, tries: tries + 1 })); addNote('This exercise will come back once more later.'); }
    else s.solved++;
    Sound.play('bad');
  }
  renderMain();
  requestAnimationFrame(() => { const b = $('[data-act="px-next"]'); if (b) b.focus({ preventScroll: true }); });
}
function pxNext() {
  const s = S.prac;
  if (!s || s.phase !== 'feedback') return;
  s.pos++; s.phase = 'answer'; s.result = null; s.ui = null;
  if (s.pos >= s.queue.length) {
    if (s.generating) s.waiting = true;
    else { pxFinish(); return; }
  }
  renderMain();
  window.scrollTo({ top: 0 });
  requestAnimationFrame(() => { const i = $('#type-ans'); if (i) i.focus({ preventScroll: true }); });
}
function pxTap(act, id) {
  const s = S.prac;
  if (!s || s.phase !== 'answer' || s.pos >= s.queue.length || !s.ui) return;
  const ex = s.queue[s.pos], ui = s.ui;
  switch (act) {
    case 'px-choice': ui.sel = Number(id); break;
    case 'px-tf': ui.sel = id === 'true'; break;
    case 'px-gap': ui.sel = Number(id); Sound.play('tick'); break;
    case 'px-gap-clear': ui.sel = null; break;
    case 'px-order-add': { const k = Number(id); if (!ui.line.includes(k)) { ui.line.push(k); Sound.play('tick'); } break; }
    case 'px-order-del': ui.line = ui.line.filter(k => k !== Number(id)); break;
    case 'px-sort-pick': { const i = Number(id); if (ui.place[i] != null) { delete ui.place[i]; ui.sel = null; } else ui.sel = ui.sel === i ? null : i; break; }
    case 'px-sort-bin': if (ui.sel != null) { ui.place[ui.sel] = Number(id); ui.sel = null; Sound.play('tick'); } break;
    case 'px-match': {
      if (ui.flash) return;
      const [side, si] = String(id).split(':');
      const i = Number(si);
      if (side === 'L') ui.selL = ui.selL === i ? null : i; else ui.selR = ui.selR === i ? null : i;
      if (ui.selL != null && ui.selR != null) {
        if (ui.selL === ui.selR) {
          ui.done.push(ui.selL); ui.selL = ui.selR = null;
          Sound.play('tick');
          if (ui.done.length === ex.pairs.length) { pxResolve(pxGrade(ex, ui), false); return; }
        } else {
          ui.mistakes++; ui.flash = [ui.selL, ui.selR];
          Sound.play('bad');
          setTimeout(() => { if (S.prac === s && s.ui === ui) { ui.flash = null; ui.selL = ui.selR = null; renderMain(); } }, 550);
        }
      }
      break;
    }
  }
  renderMain();
}
function pxFinish() {
  const s = S.prac;
  if (!s || s.done) return;
  s.done = true;
  const c = S.course, t = today();
  if (s.firstTotal >= 3 && s.firstOk === s.firstTotal) { s.bonus = 10; s.xp += 10; }
  s.acc = s.firstTotal ? s.firstOk / s.firstTotal : 0;
  const before = c.xp[t] || 0;
  c.xp[t] = before + s.xp;
  s.goalJustReached = before < c.goal && c.xp[t] >= c.goal;
  const days = Object.keys(c.xp).sort();
  if (days.length > 120) for (const k of days.slice(0, days.length - 120)) delete c.xp[k];
  if (s.key) {
    const p = c.practice[s.key] || { n: 0, good: 0, best: 0 };
    p.n++; if (s.acc >= 0.8) p.good++;
    p.best = Math.max(p.best, Math.round(s.acc * 100));
    c.practice[s.key] = p;
  }
  const fixed = new Set(s.fixed);
  c.mistakes = c.mistakes.filter(m => !fixed.has(exKey(m)));
  for (const ex of s.wrong) if (!c.mistakes.some(m => exKey(m) === exKey(ex))) c.mistakes.push(ex);
  if (c.mistakes.length > 60) c.mistakes = c.mistakes.slice(-60);
  c.sessions = (c.sessions || 0) + 1;
  markActivity(); saveCourse();
  Sound.play('done');
  renderAll();
  window.scrollTo({ top: 0 });
  setTimeout(() => checkStickers({ session: s }), 700);
}

/* ---------- offline: pool, package, export & import ---------- */
function poolAddMany(list, key) {
  if (!S.course) return 0;
  const have = new Set(S.pool.map(exKey));
  let n = 0;
  for (const ex of list) {
    if (!ex || ex.retry) continue;
    const e = cleanEx(ex);
    const k = exKey(e);
    if (have.has(k)) continue;
    e.k = key || 'all';
    S.pool.push(e); have.add(k); n++;
  }
  while (S.pool.length && bytes(JSON.stringify({ items: S.pool })) > 220000) S.pool.shift();
  if (n) Store.save('pool-' + S.course.id, { items: S.pool });
  return n;
}
function poolFor(scope) {
  const c = S.course;
  if (!c) return [];
  if (scope.startsWith('les:')) { const lid = scope.slice(4); return S.pool.filter(e => e.k === lid); }
  if (scope.startsWith('unit:')) {
    const u = c.plan && c.plan.units.find(x => x.id === scope.slice(5));
    if (!u) return [];
    const ids = new Set([u.id, ...u.lessons.map(l => l.id)]);
    return S.pool.filter(e => ids.has(e.k));
  }
  return S.pool.slice();
}
function poolBtn(scope, label, variant, hideEmpty) {
  const n = poolFor(scope).length;
  if (!n && hideEmpty) return '';
  return `<button type="button" class="btn ${variant}" data-act="prac-pool" data-id="${esc(scope)}"${(!n || S.busy) ? ' disabled title="No saved exercises yet"' : ''}>${esc(label)}</button>`;
}
function startPoolPractice(scope) {
  if (S.busy) { toast('Claude is still busy. Wait a moment or click Stop.'); return; }
  const items = poolFor(scope);
  if (!items.length) {
    toast(S.ai ? 'There are no saved exercises for this part yet.' : 'No exercises have been saved for this part yet. Practise it first in the version in Claude, or choose Get everything ready for offline there.', true);
    return;
  }
  const info = practiceScope(scope);
  const sess = newSession(scope, info.label, info.key, 0);
  sess.fromPool = true;
  shuffle(items.slice()).slice(0, 10).forEach(ex => {
    const e = clone(ex);
    if (e.type === 'choice') { const right = e.options[e.answer]; e.options = shuffle(e.options.slice()); e.answer = e.options.indexOf(right); }
    e.uid = rid(); sess.queue.push(e); sess.added++;
  });
  sess.target = sess.added; sess.waiting = false;
  S.prac = sess;
  renderAll();
  window.scrollTo({ top: 0 });
}
async function generatePool(scope, label) {
  const c = S.course;
  const info = practiceScope(scope);
  const prompt = practicePrompt(c, info);
  const res = await runAi({ kind: 'pool', label, hint: 'These exercises are saved, so you can also practise them offline later.' }, signal => S.sample(prompt, { signal, cache: false }));
  if (!res || !res.text) return false;
  const tmp = newSession(scope, info.label, info.key, 0);
  res.text.split('\n').forEach(l => pxParseLine(tmp, l));
  if (!tmp.added) {
    const t = res.text.replace(/```\w*/g, '');
    const a = t.indexOf('['), b = t.lastIndexOf(']');
    if (a >= 0 && b > a) { try { JSON.parse(t.slice(a, b + 1)).forEach(o => pxAdd(tmp, o)); } catch (e) { /* ignore */ } }
  }
  poolAddMany(tmp.queue, info.key);
  return tmp.added > 0;
}
async function prepareOffline() {
  const c = S.course;
  if (!c || !c.plan) { toast('Make a study plan first.'); return; }
  if (!S.ai) { toast('Getting ready only works in the version in Claude.', true); return; }
  if (S.busy) { toast('Claude is still busy. Wait a moment or click Stop.'); return; }
  const todo = allLessons(c).filter(x => !c.written[x.lesson.id]);
  let i = 0;
  for (const x of todo) {
    i++;
    const ok = await writeLesson(x.lesson.id, false, `Writing lesson ${i} of ${todo.length} for offline use`);
    if (!ok) { toast('Getting ready stopped. You can continue later.'); return; }
  }
  const units = c.plan.units;
  for (let j = 0; j < units.length; j++) {
    if (poolFor('unit:' + units[j].id).length >= 8) continue;
    const ok = await generatePool('unit:' + units[j].id, `Making practice exercises for chapter ${j + 1} of ${units.length}`);
    if (!ok) { toast('Getting ready stopped. You can continue later.'); return; }
  }
  toast('Everything is ready for offline use. Now download Blokboek with your subjects.');
  offlineDlg();
}
async function exportData() {
  const out = { v: 1, app: 'blokboek', id: rid(), at: new Date().toISOString(), data: { index: { courses: S.courses } } };
  for (const e of S.courses) {
    const c = await Store.get('course-' + e.id);
    if (!c) continue;
    out.data['course-' + e.id] = c;
    for (const pre of ['cards-', 'pool-']) { const v = await Store.get(pre + e.id); if (v) out.data[pre + e.id] = v; }
    for (const f of c.files || []) for (let i = 0; i < (f.docs || 0); i++) { const k = `mat-${e.id}-${f.id}-${i}`; const v = await Store.get(k); if (v) out.data[k] = v; }
    for (const lid of Object.keys(c.written || {})) { const k = `les-${e.id}-${lid}`; const v = await Store.get(k); if (v) out.data[k] = v; }
  }
  return out;
}
async function importData(pkg) {
  for (const [k, v] of Object.entries(pkg.data)) {
    if (!/^(course|cards|pool|mat|les)-[\w.~:@+-]+$/.test(k) || !v || typeof v !== 'object') continue;
    await Store.put(k, v);
  }
  for (const e of (pkg.data.index.courses || [])) {
    if (!e || !e.id || !pkg.data['course-' + e.id]) continue;
    const i = S.courses.findIndex(x => x.id === e.id);
    if (i >= 0) S.courses[i] = e; else S.courses.push(e);
  }
  await Store.put('index', { courses: S.courses });
}
function validPkg(pkg) { return !!(pkg && pkg.v === 1 && pkg.data && pkg.data.index && Array.isArray(pkg.data.index.courses)); }
function pkgDate(pkg) { try { return new Date(pkg.at).toLocaleString('en-GB', { day: 'numeric', month: 'long', hour: '2-digit', minute: '2-digit' }); } catch (e) { return ''; } }
async function handleImport(file) {
  if (!file) return;
  let pkg = null;
  try { pkg = JSON.parse(await file.text()); } catch (e) { pkg = null; }
  if (!validPkg(pkg)) { toast('This is not a Blokboek export file.', true); return; }
  const list = pkg.data.index.courses.filter(x => x && pkg.data['course-' + x.id]);
  if (!list.length) { toast('This file contains no subjects.', true); return; }
  const names = list.map(x => `"${x.name}"`).join(', ');
  const overlap = list.filter(x => S.courses.some(y => y.id === x.id)).map(x => `"${x.name}"`);
  const msg = `This file contains the ${list.length === 1 ? 'subject' : 'subjects'} ${names}, saved on ${pkgDate(pkg)}.${overlap.length ? ` The version of ${overlap.join(', ')} here will be replaced by the one in the file. Anything you did here since then will be lost.` : ''}`;
  if (!await confirmDlg(msg, 'Import')) return;
  try {
    await importData(pkg);
    toast('Imported.');
    const fresh = list.find(x => x.id !== S.cid);
    const target = (list.length === 1 && fresh) ? fresh.id : ((S.cid && pkg.data['course-' + S.cid]) ? S.cid : (S.cid || (S.courses[0] && S.courses[0].id)));
    if (target) { S.cid = null; openCourse(target); } else renderAll();
  } catch (e) {
    toast('Import failed. Try again.', true);
  }
}
async function saveFile(filename, text) {
  if (S.downloads) {
    try { await S.downloads.save({ filename, data: new Blob([text]) }); return true; }
    catch (e) {
      const code = e && e.code;
      if (code === 'declined') return false;
      if (code === 'rate_limited') { toast('A window to save a file is already open.'); return false; }
      toast('Saving doesn\'t work here.', true); return false;
    }
  }
  if (window.claude) { toast('Downloading isn\'t possible in this view.', true); return false; }
  const type = /\.json$/i.test(filename) ? 'application/json' : 'text/html';
  try {
    const file = new File([text], filename, { type });
    if (navigator.share && navigator.canShare && navigator.canShare({ files: [file] })) {
      await navigator.share({ files: [file] });
      return true;
    }
  } catch (e) { if (e && e.name === 'AbortError') return false; }
  try {
    const url = URL.createObjectURL(new Blob([text], { type: 'application/octet-stream' }));
    const a = document.createElement('a');
    a.href = url; a.download = filename;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 5000);
    return true;
  } catch (e) { toast('Download failed.', true); return false; }
}

/* ---------- markdown ---------- */
function srcChip(id) {
  const ch = S.chunks.get(id);
  if (!ch) return '';
  return `<button class="src" data-act="src" data-id="${esc(id)}" title="${esc(ch.file + ', ' + ch.loc)}" aria-label="Source: ${esc(ch.file + ', ' + ch.loc)}">${esc(ch.loc)}</button>`;
}
function inline(t) {
  let s = esc(t);
  s = s.replace(/`([^`]+)`/g, '<code>$1</code>');
  s = s.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
  s = s.replace(/(^|[^*\w])\*([^*\s][^*]*?)\*(?!\*)/g, '$1<em>$2</em>');
  s = s.replace(/\[((?:c\d+)(?:\s*[,;]\s*c\d+)*)\]/g, (m, ids) => ids.split(/\s*[,;]\s*/).map(srcChip).join(''));
  return s;
}
function renderMd(src) {
  const lines = String(src || '').replace(/\r/g, '').split('\n');
  let html = '', list = null, para = [];
  const flushP = () => { if (para.length) { html += `<p>${inline(para.join(' '))}</p>`; para = []; } };
  const flushL = () => { if (list) { html += `</${list}>`; list = null; } };
  for (const raw of lines) {
    const line = raw.trimEnd();
    let m;
    if (!line.trim()) { flushP(); flushL(); continue; }
    if ((m = line.match(/^\s*(#{1,6})\s+(.*)$/))) { flushP(); flushL(); const lvl = m[1].length <= 2 ? 3 : 4; html += `<h${lvl}>${inline(m[2])}</h${lvl}>`; continue; }
    if ((m = line.match(/^\s*[-*•]\s+(.*)$/))) { flushP(); if (list !== 'ul') { flushL(); html += '<ul>'; list = 'ul'; } html += `<li>${inline(m[1])}</li>`; continue; }
    if ((m = line.match(/^\s*\d+[.)]\s+(.*)$/))) { flushP(); if (list !== 'ol') { flushL(); html += '<ol>'; list = 'ol'; } html += `<li>${inline(m[1])}</li>`; continue; }
    if ((m = line.match(/^\s*>\s?(.*)$/))) { flushP(); flushL(); html += `<blockquote>${inline(m[1])}</blockquote>`; continue; }
    flushL(); para.push(line.trim());
  }
  flushP(); flushL();
  return html;
}

function formDlg(inner, okLabel, extraBtns = '', noCancel = false) {
  return new Promise(resolve => {
    const dlg = document.createElement('dialog');

    document.body.appendChild(dlg);
    const form = dlg.querySelector('form');
    let result = null;
    form.addEventListener('submit', e => {
      const sub = e.submitter;
      if (sub && sub.value && sub.value !== 'ok') { result = { __action: sub.value }; return; }
      result = Object.fromEntries(new FormData(form).entries());
    });
    const cancel = dlg.querySelector('[data-x="cancel"]');
    if (cancel) cancel.addEventListener('click', () => dlg.close());
    dlg.addEventListener('close', () => { dlg.remove(); resolve(result); });
    dlg.showModal();
  });
}

function normalizeCourse(c) {

async function openCourse(id) {
  if (S.busy) { toast('Claude is still busy. Wait a moment or click Stop.'); return; }
  Object.assign(S, { cid: id, course: null, quiz: null, review: null, prac: null, pool: [], lessonId: null, importing: [] });
  renderAll();

    const c = await Store.get('course-' + id);

      return;
    }
    normalizeCourse(c);
    const cd = await Store.get('cards-' + id);
    const chunks = [];
    for (const f of c.files) {
      for (let i = 0; i < (f.docs || 0); i++) {
        const m = await Store.get(`mat-${id}-${f.id}-${i}`);
        if (m && Array.isArray(m.chunks)) chunks.push(...m.chunks);
      }
    }
    if (S.cid !== id) return;
    const maxId = chunks.reduce((a, ch) => Math.max(a, parseInt(ch.id.slice(1), 10) || 0), 0);
    c.next = Math.max(c.next, maxId + 1);
    S.course = c;
    S.cards = (cd && Array.isArray(cd.cards)) ? cd.cards : [];
    let pl = null; try { pl = await Store.get('pool-' + id); } catch (e) { pl = null; }
    if (S.cid !== id) return;
    S.pool = (pl && Array.isArray(pl.items)) ? pl.items : [];
    setChunks(chunks);
    S.lessonCache = {};
    S.tab = c.plan ? 'plan' : 'material';
    rememberCourse(id);
    renderAll();

    toast('This subject could not be loaded. Refresh the page to try again.', true);

    const avg = Math.round(qs.slice(-avgN).reduce((a, q) => a + q.score / q.total, 0) / avgN * 100);
    const byLabel = {};
    for (const q of c.quizzes) { if (q.scope === 'all') continue; (byLabel[q.label] = byLabel[q.label] || []).push(q.score / q.total); }
    const weak = Object.entries(byLabel).filter(([, arr]) => { const last = arr.slice(-2); return last.reduce((a, b) => a + b, 0) / last.length < 0.7; }).map(([l]) => l);
    quizHtml = `<section><h3>Quizscores</h3><div class="qchart" role="img" aria-label="Scores of your last ${qs.length} quizzes">${qs.map(q => { const p = Math.round(q.score / q.total * 100); return `<div class="qbar" title="${esc(fmtShort.format(parseD(q.d)) + ', ' + q.label + ': ' + q.score + '/' + q.total)}"><span>${p}%</span><i style="height:${Math.max(2, p)}%"></i></div>`; }).join('')}</div>
      <p class="muted small" style="margin-top:10px">Average ${avg}% over your last ${plural(avgN, 'quiz', 'quizzes')}.</p>
      ${weak.length ? `<p class="small" style="margin-top:8px">Still tricky: ${weak.map(esc).join(', ')}.</p>` : ''}</section>`;
  } else quizHtml = `<section><h3>Quizscores</h3><p class="muted small" style="margin-top:8px">No quizzes taken yet.</p></section>`;
  const total = S.cards.length;
  let cardsHtml = `<section><h3>Flashcards</h3><p class="muted small" style="margin-top:8px">No flashcards yet.</p></section>`;
  if (total) {
    const fresh = S.cards.filter(x => !x.seen).length, master = S.cards.filter(x => x.box >= 4).length, learning = total - fresh - master;
    const w = n => (n / total * 100).toFixed(1);
    cardsHtml = `<section><h3>Flashcards</h3><div class="stack" role="img" aria-label="${fresh} new, ${learning} learning, ${master} mastered"><i style="width:${w(master)}%;background:var(--good)"></i><i style="width:${w(learning)}%;background:var(--marker-solid)"></i><i style="width:${w(fresh)}%;background:var(--rule)"></i></div>
      <div class="legend"><span style="--c:var(--good)">${master} mastered</span><span style="--c:var(--marker-solid)">${learning} learning</span><span style="--c:var(--rule)">${fresh} new</span></div></section>`;
  }
  return `<h2>Progress</h2><div class="summary">${lines.map(l => `<p>${l}</p>`).join('')}</div>
    ${albumHtml(c)}
    <div class="pgrid">${unitsHtml}<div class="stack-col">${quizHtml}${cardsHtml}</div></div>`;
}
function fileMeta(f) {
  if (f.kind === 'pdf') return `PDF, ${plural(f.parts, 'page', 'pages')}`;
  if (f.kind === 'pptx') return `PowerPoint, ${plural(f.parts, 'slide', 'slides')}`;
  if (f.kind === 'docx') return `Word, ${f.chars.toLocaleString('en-GB')} characters`;
  return `Text, ${f.chars.toLocaleString('en-GB')} characters`;
}
function materialPanel(c) {
  return `<h2>Study material</h2>
    <p class="muted">Add PDFs, PowerPoint presentations (.pptx), Word files (.docx) or text. Your files are read in your browser; only the text is saved.</p>
    <div class="drop" data-drop><input id="file-input" type="file" multiple accept=".pdf,.pptx,.docx,.txt,.md,.markdown,.csv" hidden>
      <strong>Drag your files here</strong><span class="muted small">or</span><button class="btn primary" data-act="pick-files">Choose files</button></div>
    <div id="imports">${importsHtml()}</div>
    <details class="paste"${S.pasteOpen ? ' open' : ''}><summary>Paste text or notes</summary>
      <label class="f" for="paste-title">Title</label><input id="paste-title" maxlength="80" placeholder="For example: Notes lecture 3">
      <label class="f" for="paste-text">Text</label><textarea id="paste-text" rows="8"></textarea>
      <button class="btn ghost" data-act="add-paste">Add text</button></details>
    ${c.files.length ? `<h3>Added</h3><ul class="files">${c.files.map(f => `<li><div><strong>${esc(f.name)}</strong><span class="muted">${esc(fileMeta(f))}</span></div><button class="btn ghost small" data-act="remove-file" data-id="${esc(f.id)}">Delete</button></li>`).join('')}</ul>
      <div class="cta-box">${c.plan
        ? `<p>Added or removed material? Make a new plan so the lessons match again.</p>${aiButton('gen-plan', 'Make new study plan', 'ghost')}`
        : `<p>Added everything? Let Claude make a study plan from it.</p>${aiButton('gen-plan', 'Make study plan')}`}</div>` : ''}
    <p class="muted small">Scanned PDFs made only of images, and audio recordings, can't be read. Save old .ppt and .doc files as .pptx or .docx first.</p>`;
}

/* ---------- events ---------- */
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]');
  if (!el || el.disabled) return;
  const act = el.dataset.act, id = el.dataset.id;
  switch (act) {
    case 'new-course': newCourseDlg(); break;
    case 'open-course': if (id !== S.cid) openCourse(id); break;
    case 'tab':
      if (id === 'plan' && S.tab === 'plan') S.lessonId = null;
      S.tab = id; renderMain(); break;
    case 'settings': settingsDlg(); break;
    case 'gen-plan': generatePlan(); break;
    case 'open-lesson': openLesson(id); break;
    case 'close-lesson': S.lessonId = null; renderMain(); break;
    case 'write-lesson': if (S.lessonId) writeLesson(S.lessonId, !!S.lessonCache[S.lessonId]); break;
    case 'toggle-done': {
      const c = S.course;
      if (c.done[id]) delete c.done[id];
      else { c.done[id] = today(); markActivity(); toast('Lesson marked as learned.'); setTimeout(() => checkStickers({}), 300); }
      saveCourse(); renderMain(); break;
    }
    case 'lesson-cards': if (S.lessonId) genCards('les:' + S.lessonId); break;
    case 'src': showSource(id); break;
    case 'stop': if (S.busy) S.busy.ctl.abort(); break;
    case 'start-quiz': startQuiz(); break;
    case 'quiz-pick': quizPick(Number(id)); break;
    case 'quiz-next': quizNext(); break;
    case 'quiz-quit': case 'quiz-new': S.quiz = null; renderMain(); break;
    case 'quiz-again': quizAgain(); break;
    case 'pool-quiz': startPoolQuiz(); break;
    case 'start-review': startReview(false); break;
    case 'practice-all': startReview(true); break;
    case 'flip': flip(); break;
    case 'rate': rate(id); break;
    case 'end-review': S.review = null; renderMain(); break;
    case 'gen-cards': genCards(($('#cards-scope') || {}).value || 'all'); break;
    case 'del-card': S.cards = S.cards.filter(x => x.id !== id); saveCards(); renderMain(); break;
    case 'pick-files': { const inp = $('#file-input'); if (inp) inp.click(); break; }
    case 'add-paste': {
      const text = ($('#paste-text') || {}).value || '';
      const title = (($('#paste-title') || {}).value || '').trim() || 'Aantekeningen';
      if (text.trim().length < 20) { toast('Paste a bit more text first.'); break; }
      try {
        addMaterial(title, 'text', sectionsFromText(text)).then(() => { toast('Text added.'); renderMain(); }).catch(err => toast(err.message, true));
      } catch (err) { toast(err.message, true); }
      break;
    }
    case 'remove-file': removeFile(id); break;
    case 'dismiss-import': S.importing = S.importing.filter(x => x.key !== id); paintImports(); break;
    case 'prac-all': startPractice('all'); break;
    case 'prac-unit': startPractice('unit:' + id); break;
    case 'prac-lesson': startPractice('les:' + id); break;
    case 'prac-mistakes': startMistakes(); break;
    case 'prac-again': { const sc = S.prac ? S.prac.scope : 'all'; const fromPool = S.prac && S.prac.fromPool; S.prac = null; if (sc === 'mistakes') startMistakes(); else if (fromPool) startPoolPractice(sc); else startPractice(sc); break; }
    case 'prac-pool': startPoolPractice(id); break;
    case 'inbox-add': addInbox(id); break;
    case 'inbox-later': S.inbox = S.inbox.filter(x => x.id !== id); renderMain(); break;
    case 'offline': offlineDlg(); break;
    case 'prep-offline': { const d = el.closest('dialog'); if (d) d.close(); prepareOffline(); break; }
    case 'dl-offline': downloadOffline(); break;
    case 'export-data': exportProgress(); break;
    case 'import-data': { if (S.busy) { toast('Claude is still busy. Wait a moment or click Stop.'); break; } const d = el.closest('dialog'); if (d) d.close(); const inp = $('#import-input'); if (inp) inp.click(); break; }
    case 'prac-close': S.prac = null; S.tab = 'practice'; renderAll(); break;
    case 'prac-quit': quitPractice(); break;
    case 'px-check': pxCheck(false); break;
    case 'px-skip': pxCheck(true); break;
    case 'px-next': pxNext(); break;
    case 'px-choice': case 'px-tf': case 'px-gap': case 'px-gap-clear': case 'px-order-add': case 'px-order-del':
    case 'px-match': case 'px-sort-pick': case 'px-sort-bin': pxTap(act, id); break;
    case 'sound': Sound.toggle(); if (Sound.on) Sound.play('tick'); renderMain(); break;
  }
});
document.addEventListener('change', e => {
  const t = e.target;
  if (t.id === 'file-input') { handleFiles(t.files); t.value = ''; return; }
  if (t.id === 'import-input') { const f = t.files && t.files[0]; t.value = ''; handleImport(f); return; }
  if (t.dataset && t.dataset.chg === 'perday' && S.course) { S.course.perDay = Number(t.value) || 3; saveCourse(); renderMain(); }
  if (t.dataset && t.dataset.chg === 'goal' && S.course) { S.course.goal = Number(t.value) || 30; saveCourse(); renderMain(); }
});
document.addEventListener('toggle', e => {
  const t = e.target;
  if (!t || !t.classList) return;
  if (t.classList.contains('paste')) S.pasteOpen = t.open;
  if (t.classList.contains('all-cards')) S.cardsOpen = t.open;
}, true);
window.addEventListener('dragover', e => {
  if (!e.dataTransfer || ![...e.dataTransfer.types].includes('Files')) return;
  e.preventDefault();
  const z = e.target.closest && e.target.closest('[data-drop]');
  document.querySelectorAll('[data-drop]').forEach(d => d.classList.toggle('over', d === z));
});
window.addEventListener('dragleave', e => {
  if (!e.relatedTarget) document.querySelectorAll('[data-drop]').forEach(d => d.classList.remove('over'));
});
window.addEventListener('drop', e => {
  if (!e.dataTransfer || !e.dataTransfer.files.length) return;
  e.preventDefault();
  document.querySelectorAll('[data-drop]').forEach(d => d.classList.remove('over'));
  const z = e.target.closest && e.target.closest('[data-drop]');
  if (z) handleFiles(e.dataTransfer.files);
  else if (S.course) { S.tab = 'material'; renderMain(); handleFiles(e.dataTransfer.files); }
});
document.addEventListener('keydown', e => {
  if (e.ctrlKey || e.metaKey || e.altKey) return;
  const tgt = e.target;
  const onButton = tgt.closest && tgt.closest('button');
  if (S.prac && S.course && !S.prac.done) {
    const s = S.prac;
    if (tgt.id === 'type-ans') { if (e.key === 'Enter') { e.preventDefault(); pxCheck(false); } return; }
    if (tgt.closest && tgt.closest('input, textarea, select, dialog')) return;
    if (e.key === 'Enter' && !onButton) {
      e.preventDefault();
      if (s.phase === 'feedback') pxNext();
      else if (s.pos < s.queue.length && s.ui && pxCanCheck(s.queue[s.pos], s.ui)) pxCheck(false);
      return;
    }
    if (s.phase !== 'answer' || s.pos >= s.queue.length || !s.ui) return;
    const n = '123456789'.indexOf(e.key);
    if (n < 0) return;
    const ex = s.queue[s.pos];
    if (ex.type === 'choice' && n < ex.options.length) pxTap('px-choice', String(n));
    else if (ex.type === 'truefalse' && n < 2) pxTap('px-tf', n === 0 ? 'true' : 'false');
    else if (ex.type === 'gap' && n < s.ui.tiles.length) pxTap('px-gap', String(n));
    else if (ex.type === 'order') { const avail = s.ui.tiles.map((t, k) => k).filter(k => !s.ui.line.includes(k)); if (n < avail.length) pxTap('px-order-add', String(avail[n])); }
    return;
  }
  if (tgt.closest && tgt.closest('input, textarea, select, dialog')) return;
  if (S.tab === 'cards' && S.review && !S.review.done) {
    if ((e.key === ' ' || e.key === 'Enter') && !onButton) { e.preventDefault(); flip(); }
    else if (S.review.flipped && ['1', '2', '3'].includes(e.key)) { e.preventDefault(); rate(['again', 'hard', 'good'][Number(e.key) - 1]); }
  } else if (S.tab === 'quiz' && S.quiz && !S.quiz.finished) {
    const q = S.quiz;
    const k = '1234'.indexOf(e.key);
    if (q.picks[q.i] == null && k >= 0) { e.preventDefault(); quizPick(k); }
    else if (q.picks[q.i] != null && e.key === 'Enter' && !onButton) { e.preventDefault(); quizNext(); }
  }
});

/* ---------- start ---------- */
async function init() {
  renderAll();
  await Store.init();
  try {
    const idx = await Store.get('index');
    S.courses = (idx && Array.isArray(idx.courses)) ? idx.courses : [];
  } catch (e) {
    S.courses = [];
    toast('Your subjects could not be loaded. Refresh the page.', true);
  }
  if (Store.mode !== 'db') { try { await applySeed(); } catch (e) { /* ignore */ } }
  else { try { await loadInbox(); } catch (e) { S.inbox = []; } }
  S.ready = true;
  let last = null;
  try { last = localStorage.getItem('blokboek-last'); } catch (e) { /* ignore */ }
  const pick = S.courses.find(x => x.id === last) || S.courses[0];
  if (pick) openCourse(pick.id); else renderAll();
}
init();
})();
</script>
<script id="bb-boot">
(function () {
  if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) {
    window.addEventListener('load', function () { navigator.serviceWorker.register('sw.js').catch(function () {}); });
  }
  if (navigator.storage && navigator.storage.persist) { navigator.storage.persist().catch(function () {}); }
  var tip = document.getElementById('install-tip');
  var ios = /iphone|ipad|ipod/i.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  var standalone = window.navigator.standalone === true || (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches);
  var dismissed = false;
  try { dismissed = localStorage.getItem('blokboek-install-tip') === 'done'; } catch (e) {}
  if (tip && ios && !standalone && !dismissed) tip.hidden = false;
  var close = document.getElementById('install-tip-close');
  if (close) close.addEventListener('click', function () {
    tip.hidden = true;
    try { localStorage.setItem('blokboek-install-tip', 'done'); } catch (e) {}
  });
})();
</script>
